    <text x="48" y="104" font-size="40" font-weight="bold" fill="#f7efda">How MALT checks an explanation</text>
    <text x="48" y="138" font-size="19" fill="#b3c1cd">A call trace from MALT’s own source. Select a declaration in the explorer to follow its connections.</text>

