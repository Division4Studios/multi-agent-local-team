      <text x="68" y="280">discuss</text><text x="474" y="280">ground</text><text x="903" y="228">verifiedQuote</text><text x="903" y="336">sanitizeText</text>
    </g>
    <g fill="#8edbce" font-size="15"><text x="368" y="245">calls</text><text x="819" y="194">calls</text><text x="819" y="302">calls</text></g>

    <path d="M48 397H1192" stroke="#354451"/>
    <text x="48" y="431" font-size="15" font-weight="bold" fill="#f2c66a" letter-spacing="1.5">READING THE EVIDENCE</text>
    <text x="48" y="472" font-size="22" font-weight="bold" fill="#f7efda">What the source supports</text>
    <text x="48" y="504" font-size="18" fill="#c8d3db">The reviewer keeps a candidate quote only if it</text>
    <text x="48" y="529" font-size="18" fill="#c8d3db">meets the length bounds and occurs in the source.</text>
    <text x="48" y="568" font-family="Consolas, monospace" font-size="19" fill="#8edbce">source.includes(text)</text>
    <path d="M616 451V575" stroke="#354451"/>
    <text x="649" y="472" font-size="22" font-weight="bold" fill="#f7efda">What still needs a developer</text>
    <text x="649" y="504" font-size="18" fill="#c8d3db">Why were these particular length bounds chosen?</text>
    <text x="649" y="529" font-size="18" fill="#c8d3db">Open the question and discuss the design intent.</text>
    <text x="649" y="568" font-size="18" font-weight="bold" fill="#f2c66a">Apply to architecture map</text>
