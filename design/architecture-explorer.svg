    <rect x="48" y="212" width="278" height="97" rx="10" fill="#18242d" stroke="#667f90" stroke-width="2"/>
    <rect x="454" y="212" width="270" height="97" rx="10" fill="#153330" stroke="#57d2bf" stroke-width="3"/>
