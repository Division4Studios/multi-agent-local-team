<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="610" viewBox="0 0 1240 610" role="img" aria-labelledby="title desc">
  <title id="title">How MALT checks an architectural explanation</title>
  <desc id="desc">A source-backed example. ReviewService.discuss calls ground, which calls verifiedQuote and sanitizeText. A matched source excerpt and an unanswered design question are presented separately. The developer can apply a clarification to the branch map.</desc>
  <rect width="1240" height="610" fill="#0e1217"/>
