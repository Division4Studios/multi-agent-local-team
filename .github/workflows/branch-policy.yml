name: Branch policy

# main is a copy of released dev commits, written only by the Release workflow (release.yml). Pull requests into main
# are never merged (the `main · release only` ruleset blocks every update but the Release App's); this check tells
# whoever opens one where the change should go instead.
#
# pull_request_target runs this file as it is on the default branch (dev, which is protected), never the copy in the
# pull request, so a pull request cannot edit the check it is judged by.
# It is safe here because nothing from the pull request is checked out or executed, and the job has no token
# permissions.
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  no-pull-requests:
    name: No pull requests into main
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Point to dev and the Release workflow
        run: |
          echo "::error::main is updated only by the Release workflow. Target dev instead; a maintainer releases dev with Actions → Release → Run workflow."
          exit 1
