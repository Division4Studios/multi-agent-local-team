name: Release

# The only way anything reaches main. Run it from dev (Actions → Release → Run workflow → dev) after the version bump
# pull request has merged. See docs/releasing.md.
#
# 1. prepare: the version is dev's (package.json, package-lock.json and a dated CHANGELOG.md section must agree:
#    scripts/release.mts check), and its tag must not exist yet. Everything below works on the one dev commit this
#    run started from, so later pushes to dev cannot change what ships.
# 2. verify: the full CI matrix (ci.yml) on that commit, and live: real Claude calls of every kind against the reviewer
#    image built from it (reviewer-live.yml). A build whose reviewer does not work is never released.
# 3. publish (waits for a maintainer's approval in the `release` environment):
#    - packages the .vsix and fails unless its compiled JavaScript is byte-identical to what CI tested;
#    - records a signed build provenance attestation (source: this dev commit and this workflow);
#    - copies the commit into main: a merge commit, signed by GitHub, whose tree is exactly the tested commit's;
#    - creates the vX.Y.Z tag on it and publishes the release with the .vsix and its SHA-256 checksum.
#
# Security:
# - main and v* tags accept updates only from the MALT Release GitHub App (the `main · release only` and
#   `release tags` rulesets); its key is a secret of the `release` environment, which only dev may use and which
#   needs a maintainer's approval for every run. Nobody, admins included, can push to main or merge a pull request
#   into it.
# - The App token is minted inside the publish job, after approval, for this repository only, with contents and
#   workflows write (a main update that changes workflow files needs both), and is revoked when the job ends.
# - GITHUB_TOKEN has no permissions by default; publish can only sign attestations with it. Checkouts don't persist
#   credentials, and only the steps that call GitHub receive a token. Versions and tags reach scripts as data (env),
#   checked against MAJOR.MINOR.PATCH first.
# - Releases never use the npm cache, so a poisoned cache entry from another workflow can't reach a release.
# - Every write step is safe to re-run (Re-run failed jobs): this release's own merge (still main's tip) and tag are
#   reused, a commit older than main's last release is refused before main changes, and an existing release is
#   never replaced.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Run from dev only
        run: |
          if [ "$GITHUB_REF" != "refs/heads/dev" ]; then
            echo "::error::Run the Release workflow from dev; main is only ever a copy of a released dev commit"; exit 1
          fi

      - name: Checkout the dev commit this run started from
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Version agrees everywhere and is not released yet
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::package.json version must be MAJOR.MINOR.PATCH; got $version"; exit 1
          fi
          tag="v$version"
          node scripts/release.mts check "$tag" "$RUNNER_TEMP/release-notes.md"
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" --silent 2>/dev/null; then
            echo "::error::$tag already exists. Bump the version on dev first: npm run release:bump -- patch|minor|major"; exit 1
          fi
          # The dev commit main last released (its tip's second parent) must be this commit or one of its ancestors.
          last=$(gh api "repos/$GH_REPO/commits/main" --jq '.parents[1].sha // .sha')
          status=$(gh api "repos/$GH_REPO/compare/$last...$GITHUB_SHA" --jq .status)
          if [ "$status" != "ahead" ]; then
            echo "::error::dev at $GITHUB_SHA is not newer than the last release ($last, $status)"; exit 1
          fi
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from dev at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: prepare
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  live:
    needs: prepare
    name: Live reviewer
    permissions:
      contents: read
    uses: ./.github/workflows/reviewer-live.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
    # A called workflow gets no secrets unless the caller passes them, environment secrets included (they would
    # resolve to empty strings). Only the two credentials the live test needs are passed, by name.
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  publish:
    needs: [prepare, verify, live]
    name: Copy to main and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      id-token: write # sign the build provenance attestation (Sigstore)
      attestations: write # store the attestation on this repository
    env:
      SHA: ${{ needs.prepare.outputs.sha }}
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install (lockfile only, no install scripts) and enforce dependency policy
        run: npm ci && npm run check-deps

      - name: Download the JavaScript CI tested
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: typescript7-output
          path: ${{ runner.temp }}/tested-out

      - name: Package the extension (compiles with TypeScript 7 in the isolated container)
        run: npx --no-install vsce package --no-dependencies --out "malt-${TAG#v}.vsix"

      - name: Shipped JavaScript is byte-identical to what CI tested
        run: diff -r "$RUNNER_TEMP/tested-out" out

      - name: Checksum and release notes
        run: |
          set -euo pipefail
          sha256sum "malt-${TAG#v}.vsix" | tee SHA256SUMS.txt
          node scripts/release.mts check "$TAG" "$RUNNER_TEMP/release-notes.md"

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: malt-*.vsix

      - name: Release App token (this repository only)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - name: Copy the tested commit into main
        id: main
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          tree=$(gh api "repos/$GH_REPO/git/commits/$SHA" --jq .tree.sha)
          main=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          read -r main_tree last < <(gh api "repos/$GH_REPO/git/commits/$main" --jq '.tree.sha + " " + (.parents[1].sha // .sha)')
          # A re-run whose merge is already main's tip reuses it.
          if [ "$last" = "$SHA" ] && [ "$main_tree" = "$tree" ]; then
            echo "main already holds this release: $main"
            echo "commit=$main" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Checked before main changes: a re-run of an older, superseded release must never put its files back on
          # main. main's last released dev commit has to be an ancestor of this one.
          status=$(gh api "repos/$GH_REPO/compare/$last...$SHA" --jq .status)
          if [ "$status" != "ahead" ]; then
            echo "::error::$SHA is not newer than main's last release ($last, $status); main was not changed"; exit 1
          fi
          # The merge commit's tree is the tested commit's tree exactly, so main is a copy of what was verified.
          body=$(jq -n --arg tree "$tree" --arg main "$main" --arg sha "$SHA" --arg tag "$TAG" \
            '{tree: $tree, parents: [$main, $sha], message: ("release: " + $tag + "\n\nCopies dev at " + $sha + " into main.")}')
          commit=$(gh api "repos/$GH_REPO/git/commits" --input - --jq .sha <<< "$body")
          verified=$(gh api "repos/$GH_REPO/commits/$commit" --jq .commit.verification.verified)
          if [ "$verified" != "true" ]; then
            echo "::error::GitHub did not sign the release merge commit $commit; main was not changed"; exit 1
          fi
          # Not forced: if main moved since it was read, this fails instead of overwriting it.
          gh api --method PATCH "repos/$GH_REPO/git/refs/heads/main" -f sha="$commit" -F force=false --silent
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "main is now $commit (dev $SHA)" >> "$GITHUB_STEP_SUMMARY"

      - name: Tag the release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          COMMIT: ${{ steps.main.outputs.commit }}
        run: |
          set -euo pipefail
          if existing=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha' 2>/dev/null); then
            read -r type object <<< "$existing"
            target=$object
            if [ "$type" = "tag" ]; then target=$(gh api "repos/$GH_REPO/git/tags/$object" --jq .object.sha); fi
            if [ "$target" != "$COMMIT" ]; then echo "::error::$TAG already exists and points to $target, not $COMMIT"; exit 1; fi
            echo "$TAG already points to $COMMIT"; exit 0
          fi
          body=$(jq -n --arg tag "$TAG" --arg commit "$COMMIT" \
            '{tag: $tag, message: ("MALT " + ($tag | ltrimstr("v"))), object: $commit, type: "commit"}')
          object=$(gh api "repos/$GH_REPO/git/tags" --input - --jq .sha <<< "$body")
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" --silent

      # Published with the App's token, not GITHUB_TOKEN, so the release event reaches the Discord feeds (events made
      # with GITHUB_TOKEN trigger no workflows). `gh release create` refuses if the release already exists.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --verify-tag --title "MALT ${TAG#v}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "malt-${TAG#v}.vsix" SHA256SUMS.txt
          echo "Published: https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
