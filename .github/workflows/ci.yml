name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (lockfile only, no install scripts)
        run: npm ci

      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- package.json package-lock.json

      - name: Dependency policy
        run: npm run check-deps

      - name: Audit and registry signatures
        run: npm run audit

      - name: Type-check
        run: npm run check-types

      - name: Lint (zero warnings)
        run: npm run lint

      - name: Extension tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Extension tests (Windows, macOS)
        if: runner.os != 'Linux'
        run: npm test

      - name: Package contents check
        if: runner.os == 'Linux'
        run: npx --no-install vsce ls --no-dependencies
