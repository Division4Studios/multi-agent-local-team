name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  # release.yml runs this same matrix on the dev commit it is about to release.
  workflow_call:

permissions:
  contents: read

# A called run takes the caller's github context, so the workflow name keeps a Release run's CI from cancelling, or
# being cancelled by, CI for a push to the same branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: TypeScript 7 (isolated Linux build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install and enforce dependency policy
        run: npm ci && npm run check-deps && npm run audit

      - name: Type-check with native TypeScript 7
        run: npm run check-types

      - name: Verify compiler isolation
        run: npm run test:compiler-sandbox
        env:
          MALT_COMPILER_PROBE_SECRET: must-not-enter-container

      - name: Compile once for all editor platforms
        run: npm run compile

      - name: Upload compiled JavaScript
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: typescript7-output
          path: out/
          if-no-files-found: error
          # A Release run packages from it after its approval, which may wait up to 30 days; elsewhere only the run
          # itself needs it. (A called run's github.workflow is the caller's.)
          retention-days: ${{ github.workflow == 'Release' && 30 || 1 }}

  verify:
    needs: compile
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (lockfile only, no install scripts)
        run: npm ci

      - name: Lockfile unchanged
        shell: bash
        run: git diff --exit-code -- package.json package-lock.json

      - name: Dependency policy
        run: npm run check-deps

      - name: Audit and registry signatures
        run: npm run audit

      - name: Download this run's TypeScript 7 output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: typescript7-output
          path: out/

      - name: Lint (zero warnings)
        run: npm run lint

      - name: Dependency policy and file selection regression tests
        run: npm run test:toolchain

      - name: Finalize all ten native MALT views and inspect the delivered HTML in Chrome
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/verify-architecture-publication.mjs --browser-check

      - name: Extension tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:compiled

      - name: Extension tests (Windows, macOS)
        if: runner.os != 'Linux'
        run: npm run test:compiled

      - name: Package contents check
        run: npx --no-install vsce ls --no-dependencies
