name: ✨ Feature request
description: Suggest a capability or improvement for MALT
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        <img src="https://raw.githubusercontent.com/wiki/Division4Studios/multi-agent-local-team/images/mark.png" alt="MALT" width="40">

        MALT stays small on purpose. A good request describes a real problem in reviewing AI-assisted changes. Open questions and early ideas are welcome in #ideas on the [MALT Discord](https://discord.gg/DwSpsGjvFY) first.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the pain, not the solution. Who hits it, and how often?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How might MALT help? Sketches and examples welcome.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Inline block review
        - Changes view or consolidation
        - Pull request review
        - Standards scan, rules, architecture map or gaps
        - Reviewer service or backends
        - Live reviewer log
        - Settings, models or effort
        - New area
    validations:
      required: true
  - type: dropdown
    id: cost
    attributes:
      label: Would it add model calls?
      description: Every call costs the user money or quota, so MALT asks before spending them.
      options:
        - No
        - Yes, only when the user asks for it
        - Yes, automatically
        - Not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or ways MALT could do this.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions and this is not a duplicate
          required: true
        - label: It needs no new dependency (or I opened a dependency request first)
          required: true
        - label: I'm willing to help implement this
