name: 🐛 Bug report
description: The extension, the reviewer or a command doesn't work as documented
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. A few things first:

        - **Security issues, including any way to make MALT's reviewer ignore its rules (prompt injection), must not be reported here.** Use [private vulnerability reporting](https://github.com/Division4Studios/multi-agent-local-team/security/advisories/new).
        - **A verdict you think is wrong** (a false positive or a missed problem) has its own form: [Wrong review result](https://github.com/Division4Studios/multi-agent-local-team/issues/new?template=review_quality.yml).
        - This is a public issue. Don't paste secrets, tokens or code you aren't allowed to share.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest workspace and the fewest steps that show the problem.
      placeholder: |
        1. Open a workspace with ...
        2. Run "MALT: ..." from the Command Palette
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where does the problem show up?
      options:
        - Inline block review (outlines, hover cards, Review Again)
        - Changes view or consolidation findings
        - Pull request review
        - Standards scan, rules, architecture map or gaps
        - Gap investigations
        - Reviewer start-up, health or backend (Docker or host)
        - Live reviewer log
        - Settings, models or effort
        - Status bar or Reviewer view
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Where does the reviewer run?
      description: Shown on the Reviewer row of the MALT view.
      options:
        - Docker
        - Host (no Docker)
        - The reviewer did not start
        - Don't know
    validations:
      required: true
  - type: input
    id: malt-version
    attributes:
      label: MALT version
      description: Extensions view → MALT, or the commit you built from.
      placeholder: 0.0.1
    validations:
      required: true
  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      description: Help → About
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code CLI version
      description: Output of `claude --version`, if the reviewer runs on the host.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from the MALT output channel or the live reviewer log. MALT redacts recognizable secrets, but check before posting.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: This is not a security vulnerability or a way to manipulate the reviewer
          required: true
        - label: The logs and code above contain no secrets and nothing I'm not allowed to share
          required: true
