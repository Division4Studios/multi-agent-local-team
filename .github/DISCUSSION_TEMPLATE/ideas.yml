body:
  - type: markdown
    attributes:
      value: |
        <img src="https://raw.githubusercontent.com/wiki/Division4Studios/multi-agent-local-team/images/mark.png" alt="MALT" width="40">

        Ideas are discussed on the [MALT Discord](https://discord.gg/DwSpsGjvFY) in #ideas, where it's quicker to talk them through. You can still post one here. Once there's agreement on the problem and the approach, it becomes a [feature request](https://github.com/Division4Studios/multi-agent-local-team/issues/new?template=feature_request.yml).
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What makes reviewing AI-assisted changes slower or riskier for you today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How MALT could help, and whether it would add model calls.
    validations:
      required: true
