labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        <img src="https://raw.githubusercontent.com/wiki/Division4Studios/multi-agent-local-team/images/mark.png" alt="MALT" width="40">

        Ask anything about installing, configuring or using MALT. Bugs go in [issues](https://github.com/Division4Studios/multi-agent-local-team/issues/new/choose), and security problems go to [private reporting](https://github.com/Division4Studios/multi-agent-local-team/security/advisories/new).
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do, and what have you tried?
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: MALT and VS Code versions, operating system, and whether the reviewer runs in Docker or on the host.
